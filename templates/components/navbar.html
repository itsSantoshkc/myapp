
<nav class="flex justify-between items-center px-lg py-md max-w-[1440px] mx-auto">
    <div class="flex items-center gap-xl">
        <a
        href="{% url 'index' %}"
            class="font-headline-md text-headline-md font-bold text-primary uppercase tracking-tighter">Precision
            PC</a>
        <div class="hidden md:flex gap-lg items-center">
            <a class="font-body-md text-body-md font-medium tracking-tight {% if request.resolver_match.url_name == 'index' %}text-primary border-b-2 border-primary pb-1{% else %}text-on-surface-variant hover:text-primary transition-colors{% endif %}"
                href="{% url 'index' %}">Home</a>
            {% for cat in navbar_categories %}
            <a class="font-body-md text-body-md font-medium tracking-tight {% if request.GET.c == cat.slug %}text-primary border-b-2 border-primary pb-1{% else %}text-on-surface-variant hover:text-primary transition-colors{% endif %}"
                href="{% url 'searchProduct' %}?c={{ cat.slug }}">{{ cat.name }}</a>
            {% endfor %}
        </div>
    </div>
    <div class="flex items-center gap-md">
        <form class="relative hidden lg:block" method="GET" action="{% url 'searchProduct' %}">
            <span
                class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">search</span>
            <input
                name="s"
                value="{{ request.GET.s|default:'' }}"
                class="pl-10 pr-4 py-2 bg-surface-container-low border border-outline-variant rounded-lg focus:outline-none focus:border-primary-container w-64 transition-all"
                placeholder="Search components..." type="text" />
        </form>
    {% if  user.is_authenticated %}
    <a href="{% url 'view_cart' %}" class="material-symbols-outlined {% if request.resolver_match.url_name == 'view_cart' %}text-primary{% else %}text-on-surface-variant{% endif %} hover:bg-surface-container-low p-2 rounded-full transition-all">shopping_cart</a>
    <button class="material-symbols-outlined text-on-surface-variant hover:bg-surface-container-low p-2 rounded-full transition-all ">account_circle</button>
{% else %}
<a href="{% url 'signIn' %}"
       class="px-4 py-2 rounded hover:bg-white hover:text-on-surface hover:border hover:border-outline bg-primary-container text-white  text-sm font-medium  transition-colors ">
        Sign In
    </a>
    <a href="{% url 'register' %}"
       class="px-4 py-2 rounded border border-outline hover:border-none text-on-surface text-sm hover:bg-primary-container font-medium hover:text-white transition-colors ">
        Register
    </a>
    
    {% endif %}
    </div>
</nav>
